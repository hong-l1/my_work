# 篮球检测专用YOLOv8模型
# 核心创新：P2高分辨率 C2f_DCNv3_GSGAM + P2检测头
# 针对问题：广角镜头下极小目标 + 高速运动模糊

# Parameters
nc: 2  # basketball, hoop
scales: # 沿用YOLOv8原版缩放系数，确保模型大小和速度平衡
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Backbone：在最高分辨率的P2层插入C2f_DCNv3_GSGAM
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0: P1/2 (输入尺寸的1/2)
  - [-1, 1, Conv, [128, 3, 2]]  # 1: P2/4 (输入尺寸的1/4，最高分辨率特征层)
  - [-1, 3, C2f_DCNv3_GSGAM, [128, False, 1, 0.5, 4]]  # 2: 方案中的P2增强主模块
  - [-1, 1, Conv, [256, 3, 2]]  # 3: P3/8 (输入尺寸的1/8)
  - [-1, 6, C2f, [256, True]]  # 4: P3 C2f
  - [-1, 1, Conv, [512, 3, 2]]  # 5: P4/16 (输入尺寸的1/16)
  - [-1, 6, C2f, [512, True]]  # 6: P4 C2f
  - [-1, 1, Conv, [1024, 3, 2]]  # 7: P5/32 (输入尺寸的1/32)
  - [-1, 3, C2f, [1024, True]]  # 8: P5 C2f
  - [-1, 1, SPPF, [1024, 5]]  # 9: SPPF空间金字塔池化

# Head：PAN特征融合结构，增加P2/4检测分支以提升<8x8像素篮球召回
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10: 上采样P5到P4尺寸
  - [[-1, 6], 1, Concat, [1]]  # 11: 拼接上采样P5和backbone P4
  - [-1, 3, C2f, [512]]  # 12: P4融合特征

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13: 上采样P4到P3尺寸
  - [[-1, 4], 1, Concat, [1]]  # 14: 拼接上采样P4和backbone P3
  - [-1, 3, C2f, [256]]  # 15: P3融合特征

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 16: 上采样P3到P2尺寸
  - [[-1, 2], 1, Concat, [1]]  # 17: 拼接上采样P3和增强后的backbone P2
  - [-1, 3, C2f, [128]]  # 18: P2/4超小目标分支，专门检测<8x8像素篮球

  - [-1, 1, Conv, [128, 3, 2]]  # 19: 下采样P2到P3尺寸
  - [[-1, 15], 1, Concat, [1]]  # 20: 拼接下采样P2和head P3
  - [-1, 3, C2f, [256]]  # 21: P3融合特征

  - [-1, 1, Conv, [256, 3, 2]]  # 22: 下采样P3到P4尺寸
  - [[-1, 12], 1, Concat, [1]]  # 23: 拼接下采样P3和head P4
  - [-1, 3, C2f, [512]]  # 24: P4融合特征

  - [-1, 1, Conv, [512, 3, 2]]  # 25: 下采样P4到P5尺寸
  - [[-1, 9], 1, Concat, [1]]  # 26: 拼接下采样P4和backbone SPPF
  - [-1, 3, C2f, [1024]]  # 27: P5融合特征

  - [[18, 21, 24, 27], 1, Detect, [nc]]  # 28: 检测头，输出P2/P3/P4/P5四个尺度
